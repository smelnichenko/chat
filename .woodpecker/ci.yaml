# CI: Run tests on push to non-main branches

# ONE run per change: the pull request's. Excluding main from the push trigger stopped the merge
# commit building twice, but every push to a branch that HAS an open PR still fired both pipelines -
# two identical runs of the same sha, racing for the same agent. Nothing lands here without a PR, so
# the PR run is the gate; deployment is untouched, cd.yaml still runs on push.
when:
  - event: pull_request

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 100

steps:
  - name: test
    image: eclipse-temurin:25.0.4_7-jdk
    volumes:
      - ci-cache:/cache   # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    depends_on: []
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monitor_chat
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: test
      SPRING_DATA_REDIS_HOST: valkey
    commands:
      # One Gradle home per CONCURRENT build. Sharing one deadlocks: every step is
      # its own PID namespace, so the lock file reads 'held by PID 50' while the
      # contender IS PID 50, and the protocol that asks an owner to release cannot
      # cross the namespace — it waits out the timeout and fails. A slot is a
      # directory only one build can occupy: per PULL REQUEST here, main for cd,
      # its own for each cron. Stale PR homes are pruned after a week.
      - SLOT="$CI_COMMIT_PULL_REQUEST"; [ -n "$SLOT" ] || SLOT="$CI_PIPELINE_NUMBER"
      - export GRADLE_USER_HOME=/cache/gradle/chat/pr-$SLOT
      - mkdir -p "$GRADLE_USER_HOME"
      # Stamp LAST USE. mkdir never refreshes a directory that already exists and Gradle
      # writes deeper than this level, so a slot's own mtime would freeze at creation --
      # and the prune below, which every step of every CONCURRENT build runs, would
      # rm -rf a long-lived PR's Gradle home while that PR was compiling.
      # Guarded: a slot another image created under a different UID is not ours to stamp,
      # and a cache that only ages wrongly must not fail the build.
      - touch "$GRADLE_USER_HOME" 2>/dev/null || true
      - find /cache/gradle/chat -maxdepth 1 -name 'pr-*' -mtime +7 -exec rm -rf {} + 2>/dev/null || true
      - ./gradlew check --no-daemon
    backend_options:
      kubernetes:
        resources:
          requests: { cpu: 500m, memory: 2Gi }
          limits: { cpu: 4000m, memory: 4Gi }
        secrets:
          - name: woodpecker-ci-secrets
            key: nexus_url
            target:
              env: NEXUS_URL

  - name: sonar
    image: eclipse-temurin:25.0.4_7-jdk
    volumes:
      - ci-cache:/cache   # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    environment:
    depends_on: [test]
    commands:
      # One Gradle home per CONCURRENT build. Sharing one deadlocks: every step is
      # its own PID namespace, so the lock file reads 'held by PID 50' while the
      # contender IS PID 50, and the protocol that asks an owner to release cannot
      # cross the namespace — it waits out the timeout and fails. A slot is a
      # directory only one build can occupy: per PULL REQUEST here, main for cd,
      # its own for each cron. Stale PR homes are pruned after a week.
      - SLOT="$CI_COMMIT_PULL_REQUEST"; [ -n "$SLOT" ] || SLOT="$CI_PIPELINE_NUMBER"
      - export GRADLE_USER_HOME=/cache/gradle/chat/pr-$SLOT
      - mkdir -p "$GRADLE_USER_HOME"
      # Stamp LAST USE. mkdir never refreshes a directory that already exists and Gradle
      # writes deeper than this level, so a slot's own mtime would freeze at creation --
      # and the prune below, which every step of every CONCURRENT build runs, would
      # rm -rf a long-lived PR's Gradle home while that PR was compiling.
      # Guarded: a slot another image created under a different UID is not ours to stamp,
      # and a cache that only ages wrongly must not fail the build.
      - touch "$GRADLE_USER_HOME" 2>/dev/null || true
      - find /cache/gradle/chat -maxdepth 1 -name 'pr-*' -mtime +7 -exec rm -rf {} + 2>/dev/null || true
      - '[ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] || { echo "Skipping SonarQube (no token or URL)"; exit 0; }'
      - ./gradlew sonar --no-daemon
    backend_options:
      kubernetes:
        secrets:
          - name: woodpecker-ci-secrets
            key: sonar_token
            target:
              env: SONAR_TOKEN
          - name: woodpecker-ci-secrets
            key: sonar_host_url
            target:
              env: SONAR_HOST_URL
          - name: woodpecker-ci-secrets
            key: nexus_url
            target:
              env: NEXUS_URL

services:
  - name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monitor_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
  - name: valkey
    image: valkey/valkey:8.1-alpine
