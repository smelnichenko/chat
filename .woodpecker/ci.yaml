# CI: Run tests on push to non-main branches

# ONE run per change: the pull request's. Excluding main from the push trigger stopped the merge
# commit building twice, but every push to a branch that HAS an open PR still fired both pipelines -
# two identical runs of the same sha, racing for the same agent. Nothing lands here without a PR, so
# the PR run is the gate; deployment is untouched, cd.yaml still runs on push.
when:
  - event: pull_request

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      home: /tmp  # non-root: its credentials file in a home it can write
      partial: false
      depth: 100
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }

steps:
  - name: test
    image: eclipse-temurin:25.0.5_8-jdk
    volumes:
      - ci-cache:/cache   # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    depends_on: []
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monitor_chat
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: test
      SPRING_DATA_REDIS_HOST: valkey
    commands:
      # One Gradle home for every build of every app, one Gradle on it at a time - by the kernel: the step holds a flock on
      # /cache/gradle-shared.flock while it runs, released when its processes end however they end (exit, SIGKILL, pod
      # deleted). A cancelled build still dying in its 20 s grace, an orphaned step pod or a second workflow WAITS instead
      # of writing the same caches. Gradle's own locks are kernel locks too, but its request to a holder to release goes
      # over loopback, which no other pod shares - hence this. Never delete the home's *.lock files: a live Gradle holds them.
      - export GRADLE_USER_HOME=/cache/gradle/shared
      - mkdir -p "$GRADLE_USER_HOME"
      - exec 9>>/cache/gradle-shared.flock
      - 'flock -w 1800 9 || { echo "the shared Gradle home is busy (30 min) - held by: $(cat /cache/gradle-shared.holder 2>/dev/null)"; exit 1; }'
      - 'echo "$CI_REPO pipeline $CI_PIPELINE_NUMBER step $CI_STEP_NAME since $(date -u +%FT%TZ)" > /cache/gradle-shared.holder'
      - ./gradlew check --no-daemon
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }  # the image's own user (ubuntu)
        resources:
          requests: { memory: 2Gi }
          limits: { memory: 4Gi }
        secrets:
          - name: woodpecker-ci-secrets
            key: nexus_url
            target:
              env: NEXUS_URL

  - name: sonar
    image: eclipse-temurin:25.0.5_8-jdk
    volumes:
      - ci-cache:/cache   # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    depends_on: [test]
    commands:
      # One Gradle home for every build of every app, one Gradle on it at a time - by the kernel: the step holds a flock on
      # /cache/gradle-shared.flock while it runs, released when its processes end however they end (exit, SIGKILL, pod
      # deleted). A cancelled build still dying in its 20 s grace, an orphaned step pod or a second workflow WAITS instead
      # of writing the same caches. Gradle's own locks are kernel locks too, but its request to a holder to release goes
      # over loopback, which no other pod shares - hence this. Never delete the home's *.lock files: a live Gradle holds them.
      - export GRADLE_USER_HOME=/cache/gradle/shared
      - mkdir -p "$GRADLE_USER_HOME"
      - exec 9>>/cache/gradle-shared.flock
      - 'flock -w 1800 9 || { echo "the shared Gradle home is busy (30 min) - held by: $(cat /cache/gradle-shared.holder 2>/dev/null)"; exit 1; }'
      - 'echo "$CI_REPO pipeline $CI_PIPELINE_NUMBER step $CI_STEP_NAME since $(date -u +%FT%TZ)" > /cache/gradle-shared.holder'
      # Pull requests analyse into their OWN project (schnappy-chat-pr): SonarQube CE has no branch analysis, and pull
      # requests writing into schnappy-chat mixed main's record with every branch's - its dashboard showed whoever
      # pushed last (masi's split, 2026-09-20; this repo's 2026-11-16). cd.yaml analyses main into schnappy-chat.
      # A missing token fails the gate: one that skips itself green is a gate nobody enforces.
      - '[ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] || { echo "SONAR_TOKEN or SONAR_HOST_URL is missing: the quality gate cannot be checked"; exit 1; }'
      - ./gradlew sonar --no-daemon -Dsonar.projectKey=schnappy-chat-pr -Dsonar.projectName='Schnappy Chat (pull requests)'
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }  # the image's own user (ubuntu)
        secrets:
          - name: woodpecker-ci-secrets
            key: sonar_token
            target:
              env: SONAR_TOKEN
          - name: woodpecker-ci-secrets
            key: sonar_host_url
            target:
              env: SONAR_HOST_URL
          - name: woodpecker-ci-secrets
            key: nexus_url
            target:
              env: NEXUS_URL

services:
  - name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monitor_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70 }  # postgres's own user
  - name: valkey
    image: valkey/valkey:8.1-alpine
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 1000 }  # valkey's own user
