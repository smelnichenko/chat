# CD: Test + Build + Push + Deploy on push to main
# Builds the chat image, pushes it to the Forgejo registry, and points test at it (update-infra: ci-deploy chat test);
# production follows by ops' task promote:run.

when:
  - branch: main
    event: push

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      home: /tmp  # non-root: its credentials file in a home it can write
      partial: false
      depth: 100
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }

steps:
  # ============== TEST ==============
  - name: test
    image: eclipse-temurin:25.0.5_8-jdk
    volumes:
      - ci-cache:/cache   # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monitor_chat
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: test
      SPRING_DATA_REDIS_HOST: valkey
    commands:
      # One Gradle home for every build of every app, one Gradle on it at a time - by the kernel: the step holds a flock on
      # /cache/gradle-shared.flock while it runs, released when its processes end however they end (exit, SIGKILL, pod
      # deleted). A cancelled build still dying in its 20 s grace, an orphaned step pod or a second workflow WAITS instead
      # of writing the same caches. Gradle's own locks are kernel locks too, but its request to a holder to release goes
      # over loopback, which no other pod shares - hence this. Never delete the home's *.lock files: a live Gradle holds them.
      - export GRADLE_USER_HOME=/cache/gradle/shared
      - mkdir -p "$GRADLE_USER_HOME"
      - exec 9>>/cache/gradle-shared.flock
      - 'flock -w 1800 9 || { echo "the shared Gradle home is busy (30 min) - held by: $(cat /cache/gradle-shared.holder 2>/dev/null)"; exit 1; }'
      - 'echo "$CI_REPO pipeline $CI_PIPELINE_NUMBER step $CI_STEP_NAME since $(date -u +%FT%TZ)" > /cache/gradle-shared.holder'
      - ./gradlew clean check --no-daemon
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }  # the image's own user (ubuntu)
        resources:
          requests: { memory: 2Gi }
          limits: { memory: 4Gi }
        secrets:
          - name: woodpecker-ci-secrets
            key: nexus_url
            target:
              env: NEXUS_URL

  - name: sonar
    image: eclipse-temurin:25.0.5_8-jdk
    volumes:
      - ci-cache:/cache   # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    commands:
      # One Gradle home for every build of every app, one Gradle on it at a time - by the kernel: the step holds a flock on
      # /cache/gradle-shared.flock while it runs, released when its processes end however they end (exit, SIGKILL, pod
      # deleted). A cancelled build still dying in its 20 s grace, an orphaned step pod or a second workflow WAITS instead
      # of writing the same caches. Gradle's own locks are kernel locks too, but its request to a holder to release goes
      # over loopback, which no other pod shares - hence this. Never delete the home's *.lock files: a live Gradle holds them.
      - export GRADLE_USER_HOME=/cache/gradle/shared
      - mkdir -p "$GRADLE_USER_HOME"
      - exec 9>>/cache/gradle-shared.flock
      - 'flock -w 1800 9 || { echo "the shared Gradle home is busy (30 min) - held by: $(cat /cache/gradle-shared.holder 2>/dev/null)"; exit 1; }'
      - 'echo "$CI_REPO pipeline $CI_PIPELINE_NUMBER step $CI_STEP_NAME since $(date -u +%FT%TZ)" > /cache/gradle-shared.holder'
      - '[ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] || { echo "SONAR_TOKEN or SONAR_HOST_URL is missing: the main analysis cannot run"; exit 1; }'
      - ./gradlew sonar --no-daemon -Dsonar.qualitygate.wait=false
    depends_on: [test]
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }  # the image's own user (ubuntu)
        secrets:
          - name: woodpecker-ci-secrets
            key: sonar_token
            target:
              env: SONAR_TOKEN
          - name: woodpecker-ci-secrets
            key: sonar_host_url
            target:
              env: SONAR_HOST_URL
          - name: woodpecker-ci-secrets
            key: nexus_url
            target:
              env: NEXUS_URL

  # ============== BUILD IMAGE (Kaniko) ==============
  - name: push-image
    image: gcr.io/kaniko-project/executor:debug
    commands:
      - mkdir -p /kaniko/.docker
      - |
        echo "{\"auths\":{\"git.pmon.dev\":{\"username\":\"$REGISTRY_USER\",\"password\":\"$REGISTRY_TOKEN\"}}}" > /kaniko/.docker/config.json
      - GIT_HASH=$(echo "$CI_COMMIT_SHA" | cut -c1-7)
      - |
        /kaniko/executor \
          --context=. \
          --dockerfile=Dockerfile \
          --destination=git.pmon.dev/schnappy/chat:$GIT_HASH \
          --skip-tls-verify-registry=git.pmon.dev \
          --registry-mirror=nexus.pmon.dev:8082 \
          --insecure-registry=nexus.pmon.dev:8082 \
          --cache=true \
          --cache-repo=git.pmon.dev/schnappy/chat/cache
    depends_on: [test, sonar]
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: false, runAsUser: 0, runAsGroup: 0 }  # Kaniko builds as root - root only inside its user namespace
        secrets:
          - name: woodpecker-ci-secrets
            key: registry_user
            target:
              env: REGISTRY_USER
          - name: woodpecker-ci-secrets
            key: registry_token
            target:
              env: REGISTRY_TOKEN

  # ============== UPDATE INFRA REPO (Argo CD syncs) ==============
  - name: update-infra
    image: git.pmon.dev/schnappy/ci-tools:latest  # ci-deploy in it; its user ci (uid 1000)
    commands:
      - ci-deploy chat test
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
        secrets:
          - name: woodpecker-ci-secrets
            key: infra_repo_token
            target:
              env: INFRA_TOKEN
    depends_on: [push-image]

services:
  - name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monitor_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70 }  # postgres's own user
  - name: valkey
    image: valkey/valkey:8.1-alpine
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 1000 }  # valkey's own user
